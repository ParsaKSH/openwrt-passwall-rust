[package]
name = "passwall2"
version = "26.11.1"
edition = "2021"
description = "PassWall2 rewritten in Rust: runtime, config generators, firewall, subscriptions and rpcd backend for luci-app-passwall2-rs"
license = "GPL-3.0-only"

[[bin]]
name = "passwall2"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
base64 = "0.22"
